---

name: code review flow
on:
  pull_request_target:
    branches:
      - "fork/review"
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  issue_comment:
    types:
      - created

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Review PR through OpenRouter
        # Pinned to the commit currently at the head
        uses: hustcer/deepseek-review@d8fed14d464331174c6653b419a132e83d85771d
        with:
          chat-token: ${{ secrets.OPENROUTER_API_KEY }}
          base-url: https://openrouter.ai/api/v1
          model: ${{ vars.DEEPSEEK_REVIEW_MODEL }}
          watch-mention: "@code-review"
          allowed-associations: "OWNER"
